<!DOCTYPE html>
<html>
<body>
  <video id="video" autoplay playsinline></video>
  <button onclick="connect()">Connect</button>
  <div id="log"></div>

  <script>
    let pc, ws;
    const relay = new WebSocket("ws://localhost:1755/relay?role=browser");

    relay.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === "open_link" && msg.url) {
            window.open(msg.url, "_blank");
        }
    };
    function log(msg) {
      document.getElementById("log").innerHTML += msg + "<br>";
      console.log(msg);
    }

    function connect() {
      ws = new WebSocket("ws://localhost:1755/test?role=Br2Sr");
      ws.onopen  = () => log("WS Connected");
      ws.onclose = () => log("WS Disconnected");
      ws.onerror = (e) => log("WS Error: " + e);

      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data);
        log("Got: " + msg.type);

        if (msg.type === "start") {
          await startCamera();

        } else if (msg.type === "answer") {
          await pc.setRemoteDescription(new RTCSessionDescription({ type: "answer", sdp: msg.sdp }));
          log("Answer applied");

        } else if (msg.type === "ice") {
          if (msg.candidate && msg.candidate !== "") {
            await pc.addIceCandidate(new RTCIceCandidate({
                candidate: msg.candidate,
                sdpMLineIndex: msg.sdpMLineIndex
            }));
            log("ICE added");
          }
        }
      };
    }

    async function startCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
      document.getElementById("video").srcObject = stream;
      log("Camera started");

      pc = new RTCPeerConnection({
          iceServers: [
              { urls: "stun:stun.l.google.com:19302" }
          ],
          iceCandidatePoolSize: 10,
          iceTransportPolicy: "all"
      });
      pc.onicegatheringstatechange = () => log("Gather state: " + pc.iceGatheringState);

      // Remove the double pc.onicecandidate and use this single, clean version
      pc.onicecandidate = (e) => {
        if (e.candidate && e.candidate.candidate !== "") {
          // Send the whole candidate object which includes sdpMLineIndex and sdpMid
          ws.send(JSON.stringify({ 
            type: "ice", 
            candidate: e.candidate 
          }));
          log("ICE sent");
        }
      };

      stream.getTracks().forEach(t => pc.addTrack(t, stream));

      pc.oniceconnectionstatechange = () => log("ICE state: " + pc.iceConnectionState);
      pc.onconnectionstatechange    = () => log("Conn state: " + pc.connectionState);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      ws.send(JSON.stringify({ type: "offer", sdp: offer.sdp }));
      log("Offer sent");
    }
  </script>
</body>
</html>
