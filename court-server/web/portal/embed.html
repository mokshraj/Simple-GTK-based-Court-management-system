<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Broadway Session</title>
<style>
body,html{margin:0;padding:0;height:100%;overflow:hidden;background:#000}
#wrapper{height:100vh;display:flex;flex-direction:column}
#titlebar{height:32px;background:#111;color:#eee;display:flex;align-items:center;padding:0 12px}
#titlebar button{background:none;border:none;color:#aaa;font-size:18px;cursor:pointer;margin-left:auto}
#broadway{flex:1}
</style>
</head>
<body>
<div id="wrapper">
<div id="titlebar">
Session <span id="sid">ID</span>
<button id="closeBtn" title="Close session">✕</button>
</div>
<iframe id="broadway" src="" style="border:none"></iframe>
</div>
<script>
(function(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const iframe = document.getElementById('broadway');
  const statusEl = document.getElementById('sid');
  const closeBtn = document.getElementById('closeBtn');

  if (!id) {
    document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#eee"><div>Missing session id</div></div>';
    return;
  }

  statusEl.textContent = id;
  // Launch the broadway session via POST to get JSON response
  fetch('/portal/launch?id=' + encodeURIComponent(id), {method:'POST'})
    .then(function(response) {
      if (!response.ok) throw new Error('HTTP ' + response.status);
      return response.json();
    })
    .then(function(data) {
      if (data && data.broadway_url) {
        iframe.src = data.broadway_url;
      } else {
        throw new Error('Invalid response');
      }
    })
    .catch(function(err) {
      console.error('Failed to launch session:', err);
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#eee"><div>Failed to launch session</div></div>';
    });

  // heartbeat every 5s
  setInterval(function(){
    fetch('/api/portal/heartbeat?id=' + encodeURIComponent(id), {method:'POST'}).catch(function(){});
  }, 5000);

  // close button
  closeBtn.addEventListener('click', function(){
    fetch('/api/portal/close?id=' + encodeURIComponent(id), {method:'POST'}).then(function(){
      document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#eee"><div>Session closed</div></div>';
    });
  });

  // best-effort close on tab unload — use sendBeacon for reliability
  window.addEventListener('beforeunload', function(){
    const url = '/api/portal/close?id=' + encodeURIComponent(id);
    if (navigator.sendBeacon) {
      navigator.sendBeacon(url);
    } else {
      fetch(url, {method:'POST', keepalive: true}).catch(function(){});
    }
  });

  // WebSocket connection for remote tab opening
  const wsProtocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  const wsUrl = wsProtocol + '//' + window.location.host + '/portal/ws?session=' + encodeURIComponent(id);
  const ws = new WebSocket(wsUrl);

  ws.onmessage = function(event) {
    try {
      const msg = JSON.parse(event.data);
      if (msg.type === 'open_url' && msg.url) {
        window.open(msg.url, '_blank');
      }
    } catch (e) {
      console.error('Failed to parse WS message:', e);
    }
  };

  ws.onclose = function() {
    console.log('WebSocket closed for session', id);
  };

  ws.onerror = function(err) {
    console.error('WebSocket error:', err);
  };
})();
</script>
</body>
</html>
