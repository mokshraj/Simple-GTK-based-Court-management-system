<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>GTK Broadway Portal</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #1a1a1a; color: #eee; font-family: sans-serif; overflow: hidden; }
        #container { height: 100vh; width: 100vw; display: flex; align-items: center; justify-content: center; }
        #loader { text-align: center; }
        a.button { display: inline-block; padding: 12px 24px; margin-top: 16px; background: steelblue; color: white; text-decoration: none; border-radius: 4px; cursor: pointer; }
        a.button:hover { background: #4a7ba8; }
        .small { font-size: 12px; color: #888; margin-top: 12px; }
    </style>
</head>
<body>
    <div id="container">
        <div id="loader">
            <h2>GTK Broadway Portal</h2>
            <p>Click the button below to launch a new GTK session.</p>
            <a class="button" id="newSession">New Session</a>
            <div class="small" id="status"></div>
        </div>
    </div>
    <script>
        // Allocate a session id from the server, then navigate the SAME tab
        // to /portal/embed?id=N. The embed page shows an iframe that loads
        // /broadway/N/ (reverse-proxied to the broadwayd daemon) and sends
        // heartbeats so the server can detect tab close / program exit.
        document.getElementById('newSession').addEventListener('click', function(e) {
            e.preventDefault();
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Allocating session…';
            fetch('/api/portal/new', { method: 'POST' })
                .then(r => {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(d => {
                    if (!d || !d.id) throw new Error('bad response');
                    statusEl.textContent = 'Session ' + d.id + ' ready — launching…';
                    // Navigate to the embed wrapper for this session.
                    window.location.href = '/portal/embed?id=' + d.id;
                })
                .catch(err => {
                    statusEl.textContent = 'Error: ' + err.message;
                });
        });
    </script>
</body>
</html>
