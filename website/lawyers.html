<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lawyer Directory</title>
<link rel="stylesheet" href="styles.css">
<link rel="icon" href="icon.png">
</head>

<body>
    <script src="https://unpkg.com/sql.js@1.10.3/dist/sql-wasm.js"></script>
    <script src="db.js"></script>

<header>
    <h2 onclick="goBack()" style="cursor:pointer;">⬅ Lawyer Directory</h2>
    <p>Browse lawyers by category and ranking</p>
</header>

<section class="box">

    <h2>Find Expert Lawyers</h2>
    <div id="db-status" class="db-badge loading">⏳ Loading database...</div>

    <!-- FILTER -->
    <div class="filters">
        <select id="categoryFilter">
            <option value="">All Categories</option>
            <!-- Populated dynamically from Categories table -->
        </select>

        <select id="courtFilter">
            <option value="">All Courts</option>
            <option value="Supreme Court">Supreme Court</option>
            <option value="High Court">High Court</option>
            <option value="District Court">District Court</option>
        </select>

        <input type="text" id="searchLawyer" placeholder="Search name or specialization" oninput="filterLawyers()">
        <button onclick="filterLawyers()">Search</button>
        <button onclick="resetFilters()" style="background:#000000;">Reset</button>
    </div>

    <!-- TABLE -->
    <div id="tableWrapper">
        <table id="lawyerTable">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Experience</th>
                    <th>Total Cases</th>
                    <th>Cases Won</th>
                    <th>Win Rate</th>
                    <th>Status</th>
                    <th>Court Level</th>
                    <th>Qualification</th>
                </tr>
            </thead>
            <tbody id="lawyerBody">
                <tr><td colspan="9" style="color:#888;">Loading lawyers from database...</td></tr>
            </tbody>
        </table>
    </div>

    <div id="recordCount" style="margin-top:10px; font-size:13px; color:#555;"></div>
    <div style="margin-top:6px; font-size:12px; color:#aaa;">💡 Click any row to view that lawyer's full analytics</div>

</section>

<script>
let allLawyers = [];
let db = null;

function goBack() { window.location.href = "index.html"; }

initDB().then(database => {
    db = database;
    document.getElementById('db-status').textContent = '✅ Database connected';
    document.getElementById('db-status').className = 'db-badge connected';

    // Populate category filter from Categories table
    const cats = dbQuery(db, "SELECT key, name FROM Categories ORDER BY name");
    const sel = document.getElementById('categoryFilter');
    cats.forEach(c => {
        const opt = document.createElement('option');
        opt.value = c.key;
        opt.textContent = c.name;
        sel.appendChild(opt);
    });

    // Load all lawyers (exclude test row with Lyr_ID=1)
    allLawyers = dbQuery(db, `
        SELECT
            l.Lyr_ID,
            l.Name,
            l.Experience,
            l.Total_Case,
            l.Won,
            l.status,
            l.court_level,
            l.Qualification,
            l.type,
            c.name AS CategoryName
        FROM Lawyer l
        LEFT JOIN Categories c ON l.type = c.key
        WHERE l.Lyr_ID != 1
        ORDER BY l.Won DESC
    `);

    renderTable(allLawyers);

}).catch(err => {
    document.getElementById('db-status').textContent = '❌ DB Error: ' + err.message;
    document.getElementById('db-status').className = 'db-badge error';
    console.error(err);
});

function renderTable(rows) {
    const tbody = document.getElementById('lawyerBody');
    if (rows.length === 0) {
        tbody.innerHTML = '<tr><td colspan="9" style="color:#888;">No lawyers found.</td></tr>';
        document.getElementById('recordCount').textContent = '';
        return;
    }

    tbody.innerHTML = rows.map((l, i) => {
        const total   = parseInt(l.Total_Case) || 0;
        const won     = parseInt(l.Won) || 0;
        const winRate = total > 0 ? ((won / total) * 100).toFixed(1) + '%' : '—';
        const status  = l.status ? l.status.charAt(0).toUpperCase() + l.status.slice(1).toLowerCase() : '—';
        const court   = l.court_level ? l.court_level.trim() : '—';
        const cat     = l.CategoryName || l.type || '—';

        return `<tr onclick="window.location.href='lawyer-profile.html?id=${l.Lyr_ID}'"
                    style="cursor:pointer;" title="View ${l.Name}'s analytics">
            <td>${i + 1}</td>
            <td><strong>${l.Name}</strong><br><small style="color:#888;">${cat}</small></td>
            <td>${l.Experience} yrs</td>
            <td>${total}</td>
            <td>${won}</td>
            <td>${winRate}</td>
            <td><span class="badge ${status.toLowerCase() === 'alive' ? 'badge-green' : 'badge-grey'}">${status}</span></td>
            <td>${court}</td>
            <td>${l.Qualification || '—'}</td>
        </tr>`;
    }).join('');

    document.getElementById('recordCount').textContent =
        `Showing ${rows.length} lawyer${rows.length !== 1 ? 's' : ''}`;
}

function filterLawyers() {
    const catKey  = document.getElementById('categoryFilter').value.toLowerCase();
    const court   = document.getElementById('courtFilter').value.toLowerCase();
    const search  = document.getElementById('searchLawyer').value.toLowerCase();

    const filtered = allLawyers.filter(l => {
        const matchCat    = !catKey || (l.type || '').toLowerCase() === catKey;
        const matchCourt  = !court  || (l.court_level || '').toLowerCase().includes(court);
        const matchSearch = !search
            || l.Name.toLowerCase().includes(search)
            || (l.Qualification || '').toLowerCase().includes(search)
            || (l.court_level || '').toLowerCase().includes(search);
        return matchCat && matchCourt && matchSearch;
    });

    renderTable(filtered);
}

function resetFilters() {
    document.getElementById('categoryFilter').value = '';
    document.getElementById('courtFilter').value = '';
    document.getElementById('searchLawyer').value = '';
    renderTable(allLawyers);
}
</script>
</body>
</html>
